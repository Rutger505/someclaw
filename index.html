<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>someclaw</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #111; color: #ddd; display: flex; flex-direction: column; height: 100dvh; }
  #log { flex: 1; overflow-y: auto; padding: 1rem; }
  .msg { white-space: pre-wrap; margin: 0 0 .75rem; padding: .5rem .75rem; border-radius: 6px; max-width: 80ch; }
  .user { background: #234; margin-left: auto; }
  .agent { background: #222; }
  .meta { color: #888; font: 12px monospace; background: none; padding: 0 .75rem; }
  .error { color: #f77; }
  form { display: flex; gap: .5rem; padding: .75rem; border-top: 1px solid #333; }
  input { flex: 1; padding: .5rem; background: #1b1b1b; color: inherit; border: 1px solid #444; border-radius: 6px; font: inherit; }
  button { padding: .5rem 1rem; font: inherit; }
  form a { align-self: center; color: #888; font-size: 13px; }
</style>
</head>
<body>
<div id="log"></div>
<form id="form"><input id="input" autocomplete="off" autofocus><button>Send</button><a href="https://zeroclaw.homelab.rutgerpronk.com">official</a></form>
<script>
const AGENT = new URLSearchParams(location.search).get("agent") ?? "rocky";
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
let token = localStorage.getItem("zeroclaw_token");
let sessionId = localStorage.getItem(`session.${AGENT}`) ?? crypto.randomUUID();
localStorage.setItem(`session.${AGENT}`, sessionId);
let ws, live = null; // live = element of the agent reply being streamed
let busy = false; // a turn is running: don't reload under it

function add(cls, text) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  log.append(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

async function pair(code) {
  const res = await fetch("/api/pair", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ code, device_name: "someclaw", device_type: "browser" }),
  });
  if (!res.ok) throw new Error(`pair ${res.status}: ${await res.text()}`);
  token = (await res.json()).token;
  localStorage.setItem("zeroclaw_token", token);
  add("meta", "paired");
  connect();
}

async function connect() {
  // the WS upgrade's 401 is invisible to the browser, so check the token over REST first
  const auth = await fetch("/api/status", { headers: { authorization: `Bearer ${token}` } }).catch(() => null);
  if (auth?.status === 401) return needPair();
  const q = new URLSearchParams({ token, session_id: sessionId, agent: AGENT });
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/chat?${q}`);
  ws.onopen = () => add("meta", `connected · ${AGENT} · ${sessionId}`);
  ws.onclose = (e) => {
    add("meta error", `closed ${e.code} ${e.reason}`);
    live = null;
    busy = false;
    setTimeout(connect, 2000);
  };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    switch (m.type) {
      case "chunk":
        live ??= add("agent", "");
        live.textContent += m.content ?? "";
        log.scrollTop = log.scrollHeight;
        break;
      case "chunk_reset":
        if (live) live.textContent = "";
        break;
      case "message":
      case "done": {
        const text = (m.full_response ?? m.content ?? live?.textContent ?? "").trim();
        if (text) (live ??= add("agent", "")).textContent = text;
        live = null;
        if (m.type === "done") { busy = false; add("meta", "done"); maybeReload(); }
        break;
      }
      case "tool_call":
        if (m.name) add("meta", `→ ${m.name}(${JSON.stringify(m.args ?? {})})`);
        break;
      case "tool_result":
        if (m.name) add("meta", `← ${m.name}: ${String(m.output ?? "").slice(0, 300)}`);
        break;
      case "error":
        live = null;
        busy = false;
        add("meta error", `error: ${m.message ?? JSON.stringify(m)}`);
        break;
      case "session_start":
        add("meta", `session ${m.resumed ? `resumed (${m.message_count} msgs, not shown)` : "new"}`);
        break;
      case "thinking":
        break;
      default:
        add("meta", JSON.stringify(m));
    }
  };
}

function needPair() {
  localStorage.removeItem("zeroclaw_token");
  token = null;
  add("meta", "not paired: enter the pairing code (dashboard → Pairing) and press Send");
}

form.onsubmit = (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  if (!token) return pair(text).catch((err) => add("meta error", err.message));
  if (ws?.readyState !== WebSocket.OPEN) return add("meta error", "not connected");
  add("user", text);
  busy = true;
  ws.send(JSON.stringify({ type: "message", content: text }));
};

// Auto-update: the server pushes the index.html version on connect and on every change (SSE,
// reconnects by itself after a restart or sleep). Reload when it changed and no turn is running.
let loadedVersion, newVersion;
new EventSource("/someclaw/events").onmessage = (e) => {
  loadedVersion ??= e.data;
  if (e.data !== loadedVersion && e.data !== newVersion) { newVersion = e.data; maybeReload(); }
};
function maybeReload() {
  if (!newVersion) return;
  if (busy || input.value) return add("meta", "new version: reloads after this turn / when the input is empty");
  location.reload();
}
input.oninput = () => !input.value && maybeReload();

token ? connect() : needPair();
</script>
</body>
</html>
